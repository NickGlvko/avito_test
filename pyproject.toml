[project]
name = "avito-test"
version = "0.1.0"
description = "Reproducible candidate retrieval for Russian service advertisements"
readme = "README.md"
authors = [
    { name = "kolasiki", email = "kolasiki2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "faiss-cpu>=1.15.1",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "openvino>=2026.4.0",
    "polars>=1.44.2",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers[onnx]>=5,<6",
    "threadpoolctl>=3.7.0",
]

[project.scripts]
avito-test = "avito_test.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
